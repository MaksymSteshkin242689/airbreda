<!-- Render ```mermaid fenced blocks as diagrams on GitHub Pages (kramdown emits <pre><code class="language-mermaid">). -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: true, theme: "neutral", securityLevel: "loose" });
</script>
<style>
  .markdown-body { max-width: 960px; }
  .markdown-body table { display: table; width: 100%; }
  .mermaid { text-align: center; margin: 1.5em 0; }
  .markdown-body h2 { margin-top: 2.2em; border-bottom: 1px solid #d0d7de; }
  .adr-meta { color: #57606a; font-size: 0.9em; }
  @media print { .markdown-body { max-width: none; } h2 { page-break-before: always; } }
</style>
